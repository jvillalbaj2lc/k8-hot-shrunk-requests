name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          gofmt -w $(find . -name '*.go' -type f)
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -v -count=1 -race
